      <stop offset="0" stop-color="#020715"/>
      <stop offset="0.58" stop-color="#071324"/>
      <stop offset="1" stop-color="#17264a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#13d5ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#13d5ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
